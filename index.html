/* Multi price:

   - 3+ legs: plain multiplied price × a growing multi bonus: +5% at 3 legs, +10% at 4, +15% at 5 … capped at 140%
   Every added leg raises the price (min +1c). Contradicting / same-market combos are still blocked. */

function multiPrice(ids){

  const straight=o.reduce((a,x)=>a*x,1), bonus=Math.min(MULTI_BONUS_CAP,1+MULTI_BONUS_STEP*(o.length-2));
  return Math.ceil(straight*bonus*100-1e-9)/100;}
function sgmFor(ids){
  const r=sgmRaw(ids); if(!r.ok) return r;
  let price=SEL[ids[0]].odds;
  for(let k=2;k<=ids.length;k++) price=Math.max(multiPrice(ids.slice(0,k)),Math.round((price+0.01)*100)/100);  // each new leg pushes it higher
  return {ok:true,straight:r.straight,price,cut:1-price/r.straight};}
function sgmRaw(ids){const n=ids.length;
  if(n<2) return {ok:false};
  const ms=ids.map(id=>SEL[id].mkt); if(new Set(ms).size!==n) return {ok:false,why:'Two picks from the same market — remove one'};
  const L=ids.map(legInfo); let corr=1;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const f=pair(L[i],L[j]); if(typeof f==='string') return {ok:false,why:f};}
  // each extra leg is cut by its strongest link to any other leg (not every pair stacked)
  const strongest=L.map((x,i)=>Math.min(1,...L.map((y,j)=>i===j?1:pair(x,y))));
  strongest.sort((p,q)=>p-q); strongest.slice(0,n-1).forEach(f=>corr*=f);
  const straight=ids.reduce((a,id)=>a*SEL[id].odds,1);
  const longest=Math.max(...ids.map(id=>SEL[id].odds));
  let price=straight*corr*Math.pow(SGM_LEG_MARGIN,n-1);
  price=Math.max(price,straight*(1-SGM_MAX_CUT),longest); price=Math.floor(price*100)/100;
  return {ok:true,straight,price,cut:1-price/straight};}
function canMulti(){return sgm().ok}
function baseMultiOdds(){return sgm().price}
function multiOdds(){const p=baseMultiOdds();return PROMO_SEL.boost?Math.round(p*1.125*100)/100:p}
function promoBox(){
  const P=state.promos||{boost:0,second:0};
  const chip=(k,title,desc,left)=>`<button class="promo ${PROMO_SEL[k]?'on':''}" data-promo="${k}" ${left<=0&&!PROMO_SEL[k]?'disabled':''}><b>${title}</b><span>${desc}</span><small>${PROMO_SEL[k]?'Applied ✓':left+' left'}</small></button>`;
  return `<div class="note" style="padding:8px 0 0">Promos — pick one per bet</div><div class="promos" title="One promo per bet">${chip('boost','⚡ Walky Time Bet BOOST','Boosts your payout by 12.5%',P.boost)}${chip('second','🔁 Second Chance','25% back if one leg misses',P.second)}</div>`;}
let stakes={};
function renderSlip(){
  if(!canMulti())PROMO_SEL={boost:false,second:false};
  $('#slipCnt').textContent=$('#fabCnt').textContent=state.slip.length;
  if(!state.slip.length){$('#sbody').innerHTML='<div class="empty">Tap any price to add it to your slip.<br><br>Combine 2+ from different markets for a multi.</div>';$('#sfoot').innerHTML='';return}
  let h = state.slip.map(id=>{const s=SEL[id];return `<div class="leg"><div class="r1"><div style="flex:1"><div class="sn">${s.label}</div><div class="mk">${s.mname}</div></div><span class="od">${fo(s.odds)}</span><button class="x" data-rm="${id}">✕</button></div>
   <div class="stake"><input type="number" min="0" step="1" placeholder="Stake" data-stake="${id}" value="${stakes[id]||''}"><div class="ret">Return<b>${fmt((stakes[id]||0)*s.odds)}</b></div></div></div>`}).join('');
  if(state.slip.length>1){
    const g=sgm(), ok=g.ok;
    h += `<div class="leg multi"><div class="r1"><div style="flex:1"><div class="sn">${state.slip.length}-Leg Same Game Multi</div><div class="mk">${ok?'All legs must win':g.why}</div></div><span class="od">${ok?(PROMO_SEL.boost?`<s class="was">${fo(g.price)}</s> ${fo(multiOdds())}`:fo(g.price)):'—'}</span></div>
    ${ok?`<div class="stake"><input type="number" min="0" step="1" placeholder="Stake" data-stake="multi" value="${stakes.multi||''}"><div class="ret">Return${PROMO_SEL.boost?`<s class="was">${fmt((stakes.multi||0)*baseMultiOdds())}</s>`:''}<b>${fmt((stakes.multi||0)*multiOdds())}</b></div></div>${promoBox()}<div class="quick">${[1,2,5,10].map(v=>`<button data-q="${v}">+$${v}</button>`).join('')}</div>`:''}</div>`;
  }
  $('#sbody').innerHTML=h;
  renderFoot();
}
function totalStake(){let t=0;state.slip.forEach(id=>t+=+stakes[id]||0);if(canMulti())t+=+stakes.multi||0;return t}
function renderFoot(){
  const t=totalStake();
  let ret=0;state.slip.forEach(id=>ret+=(+stakes[id]||0)*SEL[id].odds);if(canMulti())ret+=(+stakes.multi||0)*multiOdds();
  if(CONFIRMING && t>0 && t<=state.bal){
    const lines=[];state.slip.forEach(id=>{const st=+stakes[id]||0;if(st>0)lines.push(`${SEL[id].label} — ${fmt(st)} @ ${fo(SEL[id].odds)}`)});
    if(canMulti()&&(+stakes.multi||0)>0)lines.push(`${state.slip.length}-Leg Same Game Multi — ${fmt(+stakes.multi)} @ ${PROMO_SEL.boost?`<s class="was">${fo(baseMultiOdds())}</s> `:''}${fo(multiOdds())}${PROMO_SEL.boost?' ⚡ Boosted':''}${PROMO_SEL.second?' · 🔁 Second Chance':''}`);
    $('#sfoot').innerHTML=`<div class="confirm"><b>Confirm your bet${lines.length>1?'s':''}?</b>${lines.map(l=>`<div class="cl">${l}</div>`).join('')}
      <div class="tot" style="margin-top:6px"><span>Total stake</span><b>${fmt(t)}</b></div><div class="tot"><span>Potential return</span><b>${PROMO_SEL.boost&&canMulti()?`<s class="was">${fmt(ret-(+stakes.multi||0)*(multiOdds()-baseMultiOdds()))}</s> `:''}${fmt(ret)}</b></div></div>
      <div style="display:flex;gap:8px"><button class="place alt" id="cancelBtn" style="flex:1">Cancel</button><button class="place" id="confirmBtn" style="flex:2">Confirm Bet ${fmt(t)}</button></div>`;
    return;}
  CONFIRMING=false;
  $('#sfoot').innerHTML=`<div class="tot"><span>Total stake</span><b>${fmt(t)}</b></div><div class="tot"><span>Potential return</span><b>${PROMO_SEL.boost&&canMulti()?`<s class="was">${fmt(ret-(+stakes.multi||0)*(multiOdds()-baseMultiOdds()))}</s> `:''}${fmt(ret)}</b></div><button class="place" id="placeBtn" ${t<=0||t>state.bal?'disabled':''}>${t>state.bal?'Not enough fun bucks':'Place Bet'+(t>0?' '+fmt(t):'')}</button>`;
}
let CONFIRMING=false;
function toggle(id){
  CONFIRMING=false;
  const s=SEL[id];
  if(isSel(id)) state.slip=state.slip.filter(x=>x!==id);
  else { state.slip=state.slip.filter(x=>!(SEL[x].mkt===s.mkt && s.mkt.match(/^(pts|3pm|pf|ou|opp)-/))); state.slip.push(id); }
  renderAll();
}
function place(){
  const t=totalStake(); if(t<=0||t>state.bal) return;
  const now=new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
  state.slip.forEach(id=>{const st=+stakes[id]||0;if(st>0)state.bets.push({id:Date.now()+id,round:DATA.round,type:'Single',stake:st,odds:SEL[id].odds,legs:[legOf(id)],status:'open',at:now})});
  if(canMulti()&&(+stakes.multi||0)>0){
    state.bets.push({id:Date.now()+'m',round:DATA.round,type:state.slip.length+'-Leg SGM',stake:+stakes.multi,odds:+multiOdds().toFixed(2),baseOdds:baseMultiOdds(),boost:PROMO_SEL.boost,second:PROMO_SEL.second,legs:state.slip.map(legOf),status:'open',at:now});
    if(PROMO_SEL.boost)state.promos.boost--; if(PROMO_SEL.second)state.promos.second--;}
  PROMO_SEL={boost:false,second:false};
  state.bal-=t; state.slip=[]; stakes={}; save(); toast('Bet placed! Good luck 🏀'); closeSlip(); renderAll();
}
const legOf=id=>({id,label:SEL[id].label,odds:SEL[id].odds,rule:SEL[id].rule});
/* ---------- settle ---------- */
function judge(rule,R){
  const W=R.W,C=R.C,diff=W-C;
  switch(rule.k){
    case 'h2h': return rule.team==='W'?diff>0:diff<0;
    case 'line': {const fav=rule.fav||'W',fd=fav==='W'?diff:-diff;return rule.team===fav?fd>rule.line:fd<rule.line}
    case 'total': return rule.over?(W+C)>rule.line:(W+C)<rule.line;
    case 'wvtotal': return rule.over?W>rule.line:W<rule.line;
    case 'margin': return diff>=rule.lo && diff<=rule.hi;
    case 'top': {const mx=Math.max(0,...Object.values(R.p).map(v=>v[0]||0));return ((R.p[rule.p]||[0])[0]||0)===mx && mx>0}
    case 'ou': {const v=(R.p[rule.p]||[])[rule.i]||0;return rule.over?v>rule.line:v<rule.line}
    case 'pts': return ((R.p[rule.p]||[])[0]||0)>=rule.n;
    case '3pm': return ((R.p[rule.p]||[])[1]||0)>=rule.n;
    case 'pf': return ((R.p[rule.p]||[])[2]||0)>=rule.n;
  }
}
/* ---------- misc ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openSlip(){$('#slip').classList.add('open')} function closeSlip(){$('#slip').classList.remove('open')}
function prompt0(txt){const box=document.createElement('div');box.className='sharebox';box.innerHTML=`<b>Copy this and send it to the boys:</b><textarea readonly>${txt}</textarea><button class="place">Done</button>`;document.body.appendChild(box);const ta=box.querySelector('textarea');ta.focus();ta.select();box.querySelector('button').onclick=()=>box.remove();}
function bigWin(b){return b.status==='won'&&((b.legs.length>1&&b.odds>=3.5)||b.stake*b.odds>=100)}
function shareText(b){const head=bigWin(b)?'🏆 WalkerBet Big Winner':b.status==='won'?'✅ WalkerBet winner':b.status==='open'?'🏀 My WalkerBet bet':b.status==='void'?'WalkerBet bet (void)':'❌ WalkerBet bet';
  const mark=l=>b.legRes&&b.legRes[l.id]===true?'✅':b.legRes&&b.legRes[l.id]===false?'❌':'•';
  const tail=b.status==='won'?`Returned ${fmt(b.stake*b.odds)}`:b.status==='open'?'Good luck to me 🤞':b.scRefund?`Second Chance saved ${fmt(b.scRefund)}`:'';
  return `${head} (${b.round})\n`+b.legs.map(l=>`${mark(l)} ${l.label} @ ${fo(l.odds)}`).join('\n')+`\n${b.legs.length>1?b.legs.length+'-Leg Multi':'Single'} @ ${fo(b.odds)}${tail?' → '+tail:''}`}
function renderAll(){$('#bal').textContent=fmt(state.bal);renderTabs();renderMarkets();renderSlip()}
document.addEventListener('click',e=>{
  const sel=e.target.closest('[data-sel]'); if(sel){toggle(sel.dataset.sel);return}
  const tab=e.target.closest('[data-tab]'); if(tab){state.tab=tab.dataset.tab;renderAll();return}
  const all=e.target.closest('[data-all]'); if(all){const st=all.dataset.all,keys=PLAYERS.map(p=>st+'-'+pkey(p.name)),anyOpen=keys.some(k=>!COLLAPSED.has(k));keys.forEach(k=>anyOpen?COLLAPSED.add(k):COLLAPSED.delete(k));renderMarkets();return}
  const sh=e.target.closest('[data-share]'); if(sh){const b=[...state.bets,...HIST].find(x=>String(x.id)===sh.dataset.share); if(!b)return; const txt=shareText(b);
    const done=()=>toast('Copied — paste it in the group chat 🏆');
    try{navigator.clipboard.writeText(txt).then(done,()=>{prompt0(txt)})}catch(err){prompt0(txt)} return}
  const qb=e.target.closest('[data-quick]'); if(qb){const q=QUICK[+qb.dataset.quick];state.slip=[...q.ids];stakes={multi:'5'};PROMO_SEL={boost:false,second:false};CONFIRMING=false;renderAll();openSlip();toast('Multi added — check your stake, then Place Bet');return}
  const mo=e.target.closest('[data-more]'); if(mo){const k=mo.dataset.more;EXPANDED.has(k)?EXPANDED.delete(k):EXPANDED.add(k);renderMarkets();return}
  const pr=e.target.closest('[data-pr]'); if(pr){const k=pr.dataset.pr;COLLAPSED.has(k)?COLLAPSED.delete(k):COLLAPSED.add(k);renderMarkets();return}
  const mh=e.target.closest('.mh'); if(mh){const card=mh.parentElement;card.classList.toggle('closed');const k=card.dataset.oppk;if(k){card.classList.contains('closed')?COLLAPSED.add(k):COLLAPSED.delete(k)}return}
  const rm=e.target.closest('[data-rm]'); if(rm){state.slip=state.slip.filter(x=>x!==rm.dataset.rm);delete stakes[rm.dataset.rm];renderAll();return}
  const q=e.target.closest('[data-q]'); if(q){stakes.multi=(+stakes.multi||0)+ +q.dataset.q;renderSlip();return}
  const pm=e.target.closest('[data-promo]'); if(pm){const k=pm.dataset.promo;if(!PROMO_SEL[k]&&(state.promos[k]||0)<=0)return;const on=!PROMO_SEL[k];PROMO_SEL={boost:false,second:false};PROMO_SEL[k]=on;CONFIRMING=false;renderSlip();return}
  if(e.target.id==='placeBtn'){CONFIRMING=true;renderFoot();return}
  if(e.target.id==='cancelBtn'){CONFIRMING=false;renderFoot();return}
  if(e.target.id==='confirmBtn'){CONFIRMING=false;place();return}
  if(e.target.id==='clearSlip'){state.slip=[];stakes={};PROMO_SEL={boost:false,second:false};renderAll()}
  if(e.target.id==='closeSlip')closeSlip();
  if(e.target.closest('#fab'))openSlip();
  if(e.target.id==='clearHist'){if(e.target.dataset.c){HIST=[];saveHist();renderAll();toast('History cleared')}else{e.target.dataset.c=1;e.target.textContent='Tap again to clear'}}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.stake; if(!k)return;
  stakes[k]=e.target.value; CONFIRMING=false;
  const s=k==='multi'?multiOdds():SEL[k].odds;
  e.target.parentElement.querySelector('.ret b').textContent=fmt((+e.target.value||0)*s);
  const was=e.target.parentElement.querySelector('.ret s.was'); if(was&&k==='multi') was.textContent=fmt((+e.target.value||0)*baseMultiOdds());
  renderFoot();
});
loadHist(); load(); renderAll(); if(LOADMSG) setTimeout(()=>toast(LOADMSG),400);
